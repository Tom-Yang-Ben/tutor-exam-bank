name: CI

# 這個 repo 有 exam / exam_pro 兩個子專案，測試在 exam_pro 底下，
# 因此所有 run 步驟都設定 working-directory: exam_pro。
#
# 兩個 job（規劃 §5.3.4）：
#   unit         矩陣 22/24，**不連資料庫、不呼叫 Gemini、不需要任何 secrets**。
#                任何人 fork 都能在不設定 .env 的情況下跑出同一個結果。
#                這個 job **刻意不設定 TEST_DATABASE_URL**：設了的話，
#                某支測試不小心開始連 DB 也不會被發現，單元層「無 I/O」的保證就沒了。
#   integration  Node 24 + pgvector/pgvector:pg16 的 service container。
#                跑 migrations、整合測試與三個 eval suite；同樣不需要 secrets——
#                embedding 走 fixture（EMBED_MODE=fixture）、LLM 走 replay。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam_pro
    strategy:
      fail-fast: false
      matrix:
        # 矩陣 22/24（docs/roadmap-plan.md §1.5 裁決 5：橫切為準，20.x 作廢）
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: exam_pro/package-lock.json
      - run: npm ci
      # 測試不連資料庫、不呼叫 Gemini，因此不需要任何 secrets。
      # 本 job 沒有 env: 區塊——TEST_DATABASE_URL 一旦出現在這裡，
      # test/unit/ 就有機會在無人察覺的情況下開始連 DB（規劃 §5.3.4 的測試金字塔）。
      - run: npm test

      # 前端資產的語法與接點檢查（A-T13）。test/unit/publicAssets.test.js 已經涵蓋同樣的檢查，
      # 這一步保留是為了讓紅燈直接指名「是 check:html 沒過」，而不必去 test 輸出裡翻。
      - run: npm run check:html

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam_pro
    services:
      postgres:
        # 與本機 docker-compose.yml、正式環境同一顆映像：
        # 「在我電腦上會過」整類問題因此消失（規劃 §5.4）。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
          # 庫名必須以 _test 結尾，否則 migrate.js 與整合測試會拒絕執行（規劃 §5.3.4 的 DB 防呆）
          POSTGRES_DB: tutor_exam_bank_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        # 健康檢查一定要寫對，否則測試會在 PG 還沒起來時開跑，變成偶發 flaky
        options: >-
          --health-cmd "pg_isready -U exam -d tutor_exam_bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://exam:exam@localhost:5432/tutor_exam_bank_test
      # eval/.env.replay 也會設這兩個；在這裡再設一次是為了讓「CI 恆為 fixture/replay」
      # 這件事在 workflow 檔上就看得見，不必翻到別的檔案（interfaces 第 4 條）。
      EMBED_MODE: fixture
      LLM_MODE: replay
      # cassette 的鍵含模型 ID：CI 沒有 .env，這裡明寫錄製時用的模型（interfaces-stage2 裁決 S0-5／S2-29），
      # 與 config/models.js 的預設值一致；換模型＝重錄 cassette 並同步改這兩行。
      MODEL_EXTRACT: gemini:gemini-3.5-flash
      MODEL_VERIFY: gemini:gemini-3.1-pro-preview
      # fork PR 的 replay miss 降為 warning（規劃 §5.3.3、介面第 5.2 條）。
      # 判斷本身在 eval/lib/replayMiss.js（介面明說「這個判斷不在 services/llm 裡」）；
      # 這裡只負責把 GitHub 的事實傳進去。同 repo 分支與 main 上這個值是空的＝不降級。
      EVAL_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: exam_pro/package-lock.json
      - run: npm ci

      # 用 migrate:test 而不是 migrate：後者讀 DATABASE_URL，
      # 且不做「庫名以 _test 結尾」的檢查（docs/interfaces.md 第 1.1 條）。
      - name: 套用 migrations
        run: npm run migrate:test

      - name: 整合測試
        run: npm run test:integration

      # 檢索 eval：向量走 fixture、不呼叫任何外部服務。
      # 目前 queries/hybrid.js（WS-C 的 D-R1）與向量 fixture（D-V0）尚未合入，
      # run.js 會把向量／hybrid 欄印成 n/a 並在報表列出原因，門檻為 null 時只報告不擋；
      # 兩者合入後同一行指令就會自動改走 pg engine 並開始守門檻。
      - name: 檢索 eval（三欄對照）
        run: npm run eval -- --suite retrieval

      # ── 階段 2 的兩個 suite（A-T14）──
      # 兩支都在 LLM_MODE=replay 底下跑：classify 讀 eval/cassettes/，pipeline 對自製樣卷
      # eval/fixtures/sample_exam.pdf 走整條管線。**都不需要金鑰、都不連外**。
      #
      # 目前 agents/*（WS-B／WS-C）與 pipeline/stateMachine.js（WS-A）尚未合入，
      # 兩支會把分數印成 n/a 並在報表列出原因；thresholds.json 的 classify 與 pipeline
      # 兩節都是 null，所以「只報告不擋」，CI 不會因此轉紅。
      # agent 合入且 cassette 錄好之後，同一行指令就會開始守門檻——
      # 那時 replay miss 會直接讓這一步失敗（interfaces-stage2.md 第 5.2 條，訊息是凍結的）。
      - name: 章節分類 eval（cassette 回放）
        run: npm run eval:classify

      - name: 管線 eval（對自製樣卷跑整條管線）
        run: npm run eval:pipeline

      - name: 上傳 eval 報表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: exam_pro/eval/reports/
          retention-days: 30
          if-no-files-found: warn
