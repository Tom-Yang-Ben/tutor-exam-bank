<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-key" content="__API_KEY__">
    <title>家教專用數學物理題庫系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
    </style>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <div class="h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>

    <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1
                class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-3">
                🎯 家教專用數學物理題庫系統
            </h1>
            <p class="text-slate-500 font-medium">智慧抽題組卷 · AI 考卷批量分析 · 頂級出題排版工具</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <div class="lg:col-span-7 space-y-8">

                <div
                    class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all hover:shadow-md">
                    <div class="flex items-center space-x-2 mb-6 border-b border-slate-100 pb-3">
                        <span class="text-2xl">➕</span>
                        <h2 class="text-xl font-bold text-slate-800">快速手動錄入新題目</h2>
                    </div>

                    <form id="questionForm" class="space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">學科</label>
                                <select id="subject"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
                                    <option value="數學">📐 數學</option>
                                    <option value="物理">🧲 物理</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">精細章節</label>
                                <select id="chapter"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                    required>
                                    <option value="">-- 載入中 --</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">題型</label>
                                <select id="question_type"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
                                    <option value="單選">單選題</option>
                                    <option value="多選">多選題</option>
                                    <option value="填空">填空題</option>
                                    <option value="計算">計算題</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">難度評等</label>
                                <select id="difficulty"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
                                    <option value="1">★ (易)</option>
                                    <option value="2">★★</option>
                                    <option value="3" selected>★★★ (中)</option>
                                    <option value="4">★★★★</option>
                                    <option value="5">★★★★★ (難)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">題目內容 <span
                                    class="text-xs font-normal text-slate-400">(支援 LaTeX 公式)</span></label>
                            <textarea id="question_text" rows="3" placeholder="請輸入題目敘述敘述... 支援 $ $ 線內公式與 $$ $$ 獨立公式"
                                class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none resize-none"
                                required></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">標準答案 <span class="text-xs font-normal text-slate-400">(公式請用 $...$ LaTeX，如 $x=\frac{1}{2}$)</span></label>
                            <input type="text" id="answer_text" placeholder="請輸入正確答案，公式用 $ $ 包覆"
                                class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                required>
                        </div>

                        <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm hover:shadow transition-all duration-150 cursor-pointer text-center">
                            💾 儲存此題至雲端資料庫
                        </button>
                    </form>
                </div>

                <div
                    class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 transition-all hover:shadow-md">
                    <div class="flex items-center space-x-2 mb-6 border-b border-slate-100 pb-3">
                        <span class="text-2xl">📄</span>
                        <h2 class="text-xl font-bold text-slate-800">AI 智能批量錄入 (PDF 講義/考卷)</h2>
                    </div>

                    <div
                        class="border-2 border-dashed border-indigo-200 hover:border-indigo-400 p-6 rounded-2xl bg-indigo-50/30 text-center transition-all">
                        <label class="block text-sm font-bold text-indigo-700 mb-3">📎 選擇要拆解的 PDF 檔案</label>
                        <input type="file" id="pdfFile" accept=".pdf"
                            class="block w-full text-sm text-slate-500 mx-auto file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 file:cursor-pointer" />

                        <button type="button" id="uploadPdfBtn"
                            class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm hover:shadow transition-all cursor-pointer animate-pulse hover:animate-none">
                            ⚡ 啟動 AI 讀取整份 PDF 並全自動拆題
                        </button>
                        <p id="pdfStatus" class="text-sm font-medium text-slate-500 mt-3 hidden"></p>
                    </div>

                    <div id="previewArea" class="hidden mt-6 space-y-4">
                        <h3 class="font-bold text-slate-700 flex items-center space-x-1">
                            <span>🔍</span> <span>AI 拆解結果預覽（共 <span id="qCount"
                                    class="text-indigo-600 font-extrabold text-lg">0</span> 題）：</span>
                        </h3>
                        <p class="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                            💡 入庫前請先核對：下方每題都可直接修改，公式會即時渲染，確認無誤再寫入。
                        </p>

                        <div id="previewList" class="space-y-3 max-h-[30rem] overflow-y-auto pr-1"></div>

                        <button type="button" id="batchSaveBtn"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-xl shadow-sm hover:shadow transition-all cursor-pointer">
                            💾 確認無誤，一鍵寫入 MySQL 資料庫庫存
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div
                    class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 sticky top-6 transition-all hover:shadow-md">
                    <div class="flex items-center space-x-2 mb-6 border-b border-slate-100 pb-3">
                        <span class="text-2xl">🧠</span>
                        <h2 class="text-xl font-bold text-slate-800">智慧自動抽題組卷</h2>
                    </div>

                    <form id="paperForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">學生姓名</label>
                            <input type="text" id="student_name" placeholder="例如：林小明 (系統會自動避開他寫過的題)"
                                class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                required>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">學科</label>
                                <select id="paper_subject"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
                                    <option value="數學">數學</option>
                                    <option value="物理">物理</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-600 mb-1.5">指定精細章節</label>
                                <select id="paper_chapter"
                                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                    required>
                                    <option value="">-- 請先載入章節 --</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">期望抽題數量 (題)</label>
                            <input type="number" id="count" value="5" min="1"
                                class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-3 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                                required>
                        </div>

                        <button type="button" onclick="generatePaper()"
                            class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm hover:shadow transition-all cursor-pointer">
                            🔮 開始智慧篩選與生成特訓試卷
                        </button>
                    </form>

                    <div id="resultBox" class="hidden mt-6 p-5 bg-emerald-50/60 border border-emerald-200 rounded-2xl">
                        <div id="resultTitle"
                            class="font-bold text-emerald-900 text-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        </div>
                        <div id="resultIds"
                            class="text-sm text-slate-700 mt-3 whitespace-pre-line bg-white p-4 rounded-xl border border-slate-100 shadow-inner max-h-96 overflow-y-auto">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 題庫管理 -->
        <div class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
            <div class="flex items-center space-x-2 mb-6 border-b border-slate-100 pb-3">
                <span class="text-2xl">🗂️</span>
                <h2 class="text-xl font-bold text-slate-800">題庫管理 · 檢視 / 編輯 / 刪除</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-3">
                <select id="mgr_subject"
                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm">
                    <option value="">全部學科</option>
                    <option value="數學">數學</option>
                    <option value="物理">物理</option>
                </select>
                <select id="mgr_chapter"
                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm">
                    <option value="">全部章節</option>
                </select>
                <select id="mgr_type"
                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm">
                    <option value="">全部題型</option>
                    <option value="單選">單選</option>
                    <option value="多選">多選</option>
                    <option value="填空">填空</option>
                    <option value="計算">計算</option>
                    <option value="證明">證明</option>
                </select>
                <input id="mgr_search" type="text" placeholder="搜尋題目/答案關鍵字"
                    class="block w-full rounded-xl border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm">
            </div>

            <div class="flex justify-between items-center mb-4">
                <button type="button" id="mgr_search_btn"
                    class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold py-2 px-5 rounded-xl transition-all cursor-pointer">🔍 查詢</button>
                <span id="mgr_count" class="text-sm text-slate-500"></span>
            </div>

            <div id="mgr_list" class="space-y-3"></div>
            <div id="mgr_pager" class="flex justify-center items-center gap-4 mt-5"></div>
        </div>
    </div>

    <!-- 編輯題目 Modal -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800">✏️ 編輯題目 <span id="edit_id" class="text-slate-400 text-sm font-normal"></span></h3>
                <button type="button" id="edit_close" class="text-slate-400 hover:text-slate-700 text-3xl leading-none cursor-pointer">&times;</button>
            </div>
            <div id="edit_body"></div>
            <div class="flex justify-end gap-3 mt-5">
                <button type="button" id="edit_cancel"
                    class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50 cursor-pointer">取消</button>
                <button type="button" id="edit_save"
                    class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold cursor-pointer">💾 儲存變更</button>
            </div>
        </div>
    </div>

    <script>
        let allChapters = [];
        let globalAnalyzedQuestions = [];
        let currentPaperCache = null;

        // 自動帶上 API 金鑰（若後端有設定）的 fetch 封裝
        const API_KEY = (document.querySelector('meta[name="api-key"]')?.content || '').trim();
        function apiFetch(url, options = {}) {
            const headers = new Headers(options.headers || {});
            if (API_KEY) headers.set('x-api-key', API_KEY);
            return fetch(url, { ...options, headers });
        }

        let chapterWhitelist = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([fetchChapters(), loadChapterWhitelist()]);
            fillMgrChapters();
            initManager();
            fetchQuestions(1);
        });

        // 載入手動錄入用的章節白名單下拉
        async function loadChapterWhitelist() {
            try {
                const res = await apiFetch('/api/chapter-whitelist');
                if (res.ok) {
                    chapterWhitelist = await res.json();
                    updateManualChapterDropdown();
                }
            } catch (e) { console.error("載入章節白名單失敗:", e); }
        }

        function updateManualChapterDropdown() {
            const subject = document.getElementById('subject').value;
            const sel = document.getElementById('chapter');
            const list = chapterWhitelist[subject] || [];
            sel.innerHTML = '<option value="">-- 請選擇精細章節 --</option>';
            list.forEach(ch => {
                const opt = document.createElement('option');
                opt.value = ch;
                opt.innerText = ch;
                sel.appendChild(opt);
            });
        }

        document.getElementById('subject').addEventListener('change', updateManualChapterDropdown);

        // ============ 共用工具 ============
        const SELCLS = 'rounded-lg border-slate-200 bg-slate-50/50 p-2 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm';
        const TACLS = 'block w-full rounded-lg border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm resize-y';
        const INCLS = 'block w-full rounded-lg border-slate-200 bg-slate-50/50 p-2.5 border text-slate-700 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-sm';
        const PAGEBTN = 'text-sm px-4 py-2 rounded-lg border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer';
        const Q_TYPES = ['單選', '多選', '填空', '計算', '證明'];

        function el(tag, cls, props) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (props) Object.assign(e, props);
            return e;
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function renderMath(node) {
            if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                window.MathJax.typesetPromise([node]).catch(() => { });
            }
        }

        // 可重複使用的「題目編輯器」：直接就地修改傳入的 q 物件，並提供即時 MathJax 預覽
        function createQuestionEditor(q) {
            const wrap = el('div', 'space-y-2');
            const row = el('div', 'grid grid-cols-2 sm:grid-cols-4 gap-2');

            const subjSel = el('select', SELCLS);
            ['數學', '物理'].forEach(s => { const o = el('option', null, { value: s, textContent: s }); if (q.subject === s) o.selected = true; subjSel.appendChild(o); });
            const chapSel = el('select', SELCLS);
            const typeSel = el('select', SELCLS);
            Q_TYPES.forEach(t => { const o = el('option', null, { value: t, textContent: t }); if ((q.question_type || '填空') === t) o.selected = true; typeSel.appendChild(o); });
            const diffSel = el('select', SELCLS);
            [1, 2, 3, 4, 5].forEach(d => { const o = el('option', null, { value: d, textContent: '★'.repeat(d) }); if ((q.difficulty || 3) == d) o.selected = true; diffSel.appendChild(o); });

            function fillChapters() {
                const list = chapterWhitelist[subjSel.value] || [];
                chapSel.innerHTML = '';
                if (q.chapter && !list.includes(q.chapter)) {
                    chapSel.appendChild(el('option', null, { value: q.chapter, textContent: q.chapter + '（非白名單）', selected: true }));
                }
                list.forEach(c => { const o = el('option', null, { value: c, textContent: c }); if (q.chapter === c) o.selected = true; chapSel.appendChild(o); });
            }
            fillChapters();
            row.append(subjSel, chapSel, typeSel, diffSel);

            const qTa = el('textarea', TACLS, { rows: 3, value: q.question_text || '' });
            qTa.placeholder = '題目內容（公式用 $...$）';
            const aIn = el('input', INCLS, { value: q.answer_text || '', placeholder: '標準答案（公式用 $...$）' });

            const prev = el('div', 'p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm');
            const prevQ = el('div', 'mb-1 text-slate-700');
            const prevA = el('div', 'text-emerald-700 font-semibold');
            prev.append(el('div', 'text-xs text-slate-400 mb-1', { textContent: '即時預覽：' }), prevQ, prevA);

            let timer;
            function sync() {
                q.subject = subjSel.value;
                q.chapter = chapSel.value;
                q.question_type = typeSel.value;
                q.difficulty = parseInt(diffSel.value);
                q.question_text = qTa.value;
                q.answer_text = aIn.value;
                prevQ.textContent = qTa.value || '（無內容）';
                prevA.textContent = aIn.value ? ('答：' + aIn.value) : '';
                renderMath(prev);
            }
            subjSel.addEventListener('change', () => { fillChapters(); sync(); });
            [chapSel, typeSel, diffSel].forEach(s => s.addEventListener('change', sync));
            [qTa, aIn].forEach(i => i.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(sync, 350); }));
            sync();

            wrap.append(row, qTa, aIn, prev);
            return wrap;
        }

        // ============ 題庫管理 ============
        let mgrPage = 1;

        function fillMgrChapters() {
            const subj = document.getElementById('mgr_subject').value;
            const sel = document.getElementById('mgr_chapter');
            sel.innerHTML = '<option value="">全部章節</option>';
            let chaps = subj ? (chapterWhitelist[subj] || []) : [...(chapterWhitelist['數學'] || []), ...(chapterWhitelist['物理'] || [])];
            chaps.forEach(c => sel.appendChild(el('option', null, { value: c, textContent: c })));
        }

        function initManager() {
            document.getElementById('mgr_subject').addEventListener('change', () => { fillMgrChapters(); fetchQuestions(1); });
            document.getElementById('mgr_chapter').addEventListener('change', () => fetchQuestions(1));
            document.getElementById('mgr_type').addEventListener('change', () => fetchQuestions(1));
            document.getElementById('mgr_search_btn').addEventListener('click', () => fetchQuestions(1));
            document.getElementById('mgr_search').addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchQuestions(1); });
            document.getElementById('edit_close').addEventListener('click', closeEditModal);
            document.getElementById('edit_cancel').addEventListener('click', closeEditModal);
            document.getElementById('editModal').addEventListener('click', (e) => { if (e.target.id === 'editModal') closeEditModal(); });
            document.getElementById('edit_save').addEventListener('click', saveEdit);
        }

        async function fetchQuestions(page = 1) {
            mgrPage = page;
            const params = new URLSearchParams();
            const s = document.getElementById('mgr_subject').value; if (s) params.set('subject', s);
            const c = document.getElementById('mgr_chapter').value; if (c) params.set('chapter', c);
            const t = document.getElementById('mgr_type').value; if (t) params.set('question_type', t);
            const q = document.getElementById('mgr_search').value.trim(); if (q) params.set('q', q);
            params.set('page', page); params.set('limit', 10);
            try {
                const res = await apiFetch('/api/questions?' + params.toString());
                if (!res.ok) return;
                renderQuestionList(await res.json());
            } catch (e) { console.error('載入題庫失敗:', e); }
        }

        function renderQuestionList(data) {
            const list = document.getElementById('mgr_list');
            list.innerHTML = '';
            document.getElementById('mgr_count').textContent = `共 ${data.total} 題`;
            if (!data.questions.length) {
                list.innerHTML = '<p class="text-slate-400 text-sm py-8 text-center">沒有符合條件的題目</p>';
                document.getElementById('mgr_pager').innerHTML = '';
                return;
            }
            data.questions.forEach(q => {
                const card = el('div', 'border border-slate-200 rounded-xl p-4 hover:shadow-sm transition-all');
                const head = el('div', 'flex justify-between items-start gap-3 mb-2');
                const meta = el('div', 'text-xs leading-relaxed');
                meta.innerHTML = `<span class="font-mono text-slate-400">#${q.id}</span> <span class="font-semibold text-indigo-600">${escapeHtml(q.subject)}·${escapeHtml(q.chapter)}</span> <span class="text-slate-500">[${escapeHtml(q.question_type)}]</span> <span class="text-amber-500">${'★'.repeat(q.difficulty)}</span>`;
                const btns = el('div', 'flex gap-2 shrink-0');
                const editBtn = el('button', 'text-xs px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-semibold hover:bg-blue-100 cursor-pointer', { type: 'button', textContent: '✏️ 編輯' });
                editBtn.addEventListener('click', () => openEditModal(q));
                const delBtn = el('button', 'text-xs px-3 py-1.5 rounded-lg bg-rose-50 text-rose-700 font-semibold hover:bg-rose-100 cursor-pointer', { type: 'button', textContent: '🗑️ 刪除' });
                delBtn.addEventListener('click', () => deleteQuestion(q));
                btns.append(editBtn, delBtn);
                head.append(meta, btns);

                const qDiv = el('div', 'text-sm text-slate-700'); qDiv.textContent = q.question_text;
                const aDiv = el('div', 'text-sm text-emerald-700 font-semibold mt-1'); aDiv.textContent = '答：' + (q.answer_text || '');
                card.append(head, qDiv, aDiv);
                list.appendChild(card);
            });
            renderMath(list);

            const pager = document.getElementById('mgr_pager');
            pager.innerHTML = '';
            if (data.totalPages > 1) {
                const prev = el('button', PAGEBTN, { type: 'button', textContent: '← 上一頁', disabled: data.page <= 1 });
                prev.addEventListener('click', () => fetchQuestions(data.page - 1));
                const info = el('span', 'text-sm text-slate-500', { textContent: `第 ${data.page} / ${data.totalPages} 頁` });
                const next = el('button', PAGEBTN, { type: 'button', textContent: '下一頁 →', disabled: data.page >= data.totalPages });
                next.addEventListener('click', () => fetchQuestions(data.page + 1));
                pager.append(prev, info, next);
            }
        }

        async function deleteQuestion(q) {
            if (!confirm(`確定刪除題目 #${q.id}？\n此動作無法復原。`)) return;
            try {
                const res = await apiFetch('/api/questions/' + q.id, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) { await fetchQuestions(mgrPage); await fetchChapters(); }
                else alert('刪除失敗：' + (data.message || ''));
            } catch (e) { alert('連線失敗'); }
        }

        // ============ 編輯 Modal ============
        let editingObj = null;
        function openEditModal(q) {
            editingObj = { ...q };
            document.getElementById('edit_id').textContent = '#' + q.id;
            const body = document.getElementById('edit_body');
            body.innerHTML = '';
            body.appendChild(createQuestionEditor(editingObj));
            document.getElementById('editModal').classList.remove('hidden');
        }
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingObj = null;
        }
        async function saveEdit() {
            if (!editingObj) return;
            const btn = document.getElementById('edit_save');
            btn.disabled = true;
            try {
                const res = await apiFetch('/api/questions/' + editingObj.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(editingObj)
                });
                const data = await res.json();
                if (res.ok) { closeEditModal(); await fetchQuestions(mgrPage); await fetchChapters(); }
                else alert('儲存失敗：' + (data.message || ''));
            } catch (e) { alert('連線失敗'); } finally { btn.disabled = false; }
        }

        async function fetchChapters() {
            try {
                const response = await apiFetch('/api/chapters');
                if (response.ok) {
                    allChapters = await response.json();
                    updateChapterDropdown();
                }
            } catch (error) { console.error("初始化章節失敗:", error); }
        }

        document.getElementById('paper_subject').addEventListener('change', () => { updateChapterDropdown(); });

        function updateChapterDropdown() {
            const currentSubject = document.getElementById('paper_subject').value;
            const chapterSelect = document.getElementById('paper_chapter');
            chapterSelect.innerHTML = '';

            const filtered = allChapters.filter(item => item.subject === currentSubject);
            if (filtered.length === 0) {
                chapterSelect.innerHTML = '<option value="">(目前此科目無庫存題目)</option>';
                return;
            }

            chapterSelect.innerHTML = `<option value="">-- 請選擇精細章節 (共 ${filtered.length} 個) --</option>`;
            filtered.forEach(item => {
                const option = document.createElement('option');
                option.value = item.chapter;
                option.innerText = item.chapter;
                chapterSelect.appendChild(option);
            });
        }

        // 1. PDF 智慧批量分析
        document.getElementById('uploadPdfBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('pdfFile');
            const statusText = document.getElementById('pdfStatus');
            const previewArea = document.getElementById('previewArea');
            const listEl = document.getElementById('previewList');
            const btn = document.getElementById('uploadPdfBtn');

            if (!fileInput.files || fileInput.files.length === 0) return alert("請先選取 PDF！");

            statusText.classList.remove('hidden', 'text-rose-600', 'text-emerald-600');
            statusText.className = "text-sm font-medium text-indigo-600 mt-3";
            statusText.innerText = "⏳ 正在分析整份 PDF 所有題目，AI 計算答案中...";
            previewArea.classList.add('hidden');
            listEl.innerHTML = "";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('pdf', fileInput.files[0]);

            try {
                const response = await apiFetch('/api/analyze-pdf', { method: 'POST', body: formData });
                const result = await response.json();

                if (response.ok && Array.isArray(result)) {
                    globalAnalyzedQuestions = result;
                    document.getElementById('qCount').innerText = result.length;

                    result.forEach((q, idx) => {
                        const card = el('div', 'border border-slate-200 rounded-xl p-3 bg-white');
                        card.appendChild(el('div', 'text-xs font-bold text-slate-400 mb-2', { textContent: `第 ${idx + 1} 題` }));
                        card.appendChild(createQuestionEditor(q)); // 就地編輯：修改會同步回 globalAnalyzedQuestions
                        listEl.appendChild(card);
                    });

                    statusText.className = "text-sm font-bold text-emerald-600 mt-3";
                    statusText.innerText = "✅ 分析完畢！請核對下方各題（可直接修改），確認後再入庫。";
                    previewArea.classList.remove('hidden');
                } else {
                    statusText.className = "text-sm font-bold text-rose-600 mt-3";
                    statusText.innerText = "❌ 分析失敗：" + (result.message || "錯誤");
                }
            } catch (error) {
                statusText.className = "text-sm font-bold text-rose-600 mt-3";
                statusText.innerText = "❌ 連線失敗。";
            } finally { btn.disabled = false; }
        });

        // 2. 一鍵批量入庫
        document.getElementById('batchSaveBtn').addEventListener('click', async () => {
            if (globalAnalyzedQuestions.length === 0) return;
            const btn = document.getElementById('batchSaveBtn');
            btn.disabled = true;

            try {
                const response = await apiFetch('/api/batch-save-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ questions: globalAnalyzedQuestions })
                });
                const resData = await response.json();
                alert(resData.message);
                if (response.ok) {
                    document.getElementById('previewArea').classList.add('hidden');
                    document.getElementById('pdfStatus').innerText = "🎉 所有題目已成功寫入 MySQL 資料庫！";
                    document.getElementById('pdfFile').value = "";
                    await fetchChapters();
                }
            } catch (e) { alert("寫入失敗"); } finally { btn.disabled = false; }
        });

        // 3. 手動錄入
        document.getElementById('questionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                subject: document.getElementById('subject').value,
                chapter: document.getElementById('chapter').value,
                question_type: document.getElementById('question_type').value,
                difficulty: parseInt(document.getElementById('difficulty').value),
                question_text: document.getElementById('question_text').value,
                answer_text: document.getElementById('answer_text').value
            };

            try {
                const response = await apiFetch('/api/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                alert(result.message);
                if (response.ok) {
                    document.getElementById('questionForm').reset();
                    await fetchChapters();
                }
            } catch (error) { alert("無法連線伺服器"); }
        });

        // 4. 智慧組卷
        async function generatePaper() {
            const studentNameInput = document.getElementById('student_name');
            const subjectSelect = document.getElementById('paper_subject');
            const chapterSelect = document.getElementById('paper_chapter');
            const countInput = document.getElementById('count');

            if (!studentNameInput.value.trim()) return alert("請輸入學生姓名！");
            if (!chapterSelect.value) return alert("請選擇出題章節！");

            const data = {
                student_name: studentNameInput.value.trim(),
                subject: subjectSelect.value,
                chapter: chapterSelect.value,
                count: parseInt(countInput.value) || 5
            };

            try {
                const response = await apiFetch('/api/generate-paper', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const resultBox = document.getElementById('resultBox');
                const resultIds = document.getElementById('resultIds');
                resultBox.classList.remove('hidden');

                if (response.ok) {
                    currentPaperCache = {
                        paper_title: result.paper_title,
                        student_name: data.student_name,
                        question_ids: result.question_ids
                    };

                    document.getElementById('resultTitle').innerHTML = `
                        <span class="text-emerald-900">✨ ${result.paper_title}</span>
                        <button type="button" onclick="downloadWordFile()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-sm hover:shadow transition-all cursor-pointer">
                            📥 下載標準 Word 考卷檔 (.docx)
                        </button>
                    `;

                    let infoText = `本次抽出的題目 ID 清單：${JSON.stringify(result.question_ids)}\n(自動避開歷史重複題目)\n\n📝 【 線上考卷題目預覽 】：\n`;
                    result.questions.forEach((q, index) => {
                        infoText += `\n第 ${index + 1} 題 [${q.question_type}] (難度: ${'★'.repeat(q.difficulty)})\n👉 題目：${q.question_text}\n💡 參考答案：${q.answer_text}\n--------------------------------------`;
                    });

                    resultIds.textContent = infoText; // 🎯 安全防護

                    if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                        window.MathJax.typesetPromise([resultIds]);
                    }
                } else {
                    document.getElementById('resultTitle').innerHTML = `<span class="text-rose-600">❌ 出題失敗原因：</span>`;
                    resultIds.className = "text-sm text-rose-500 mt-1 font-semibold";
                    resultIds.textContent = result.message || "未知錯誤";
                }
            } catch (error) { alert("與後端連線中斷"); }
        }

        // 5. 下載 Word 檔案
        async function downloadWordFile() {
            if (!currentPaperCache) return alert("請先生成考卷！");

            try {
                const response = await apiFetch('/api/download-word?v=' + Date.now(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPaperCache)
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/vnd.openxmlformats-officedocument')) {
                    throw new Error("後端回傳格式非合法二進位 Word 文件，下載失敗！");
                }

                const responseBuffer = await response.arrayBuffer();
                const blob = new Blob([responseBuffer], {
                    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                });

                const url = window.URL.createObjectURL(blob);
                const
